name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/electron/package-lock.json
            packages/*/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unreviewed secrets
        shell: bash
        run: |
          python -m pip install detect-secrets
          git grep -Il -e . -- . | grep -v '^.secrets.baseline$' | xargs -n 100 detect-secrets-hook --baseline .secrets.baseline
      - name: Install and build shared packages
        run: |
          for n in ai-providers calendar-sync connectors connectors-slack database jensen-protocol knowledge-graph transcription; do
            (cd "packages/$n" && npm ci --ignore-scripts && npm run build --if-present)
          done
          (cd packages/database && npm rebuild better-sqlite3)
          (cd packages/knowledge-graph && npm rebuild better-sqlite3)
      - name: Lint and test shared packages
        run: |
          for n in ai-providers calendar-sync connectors connectors-slack database jensen-protocol knowledge-graph transcription; do
            (cd "packages/$n" && npm run lint --if-present && npm test)
          done
      - name: Install app
        working-directory: apps/electron
        run: npm ci
      - name: Restore Node ABI for tests
        working-directory: packages/database
        run: npm rebuild better-sqlite3
      - name: Typecheck
        working-directory: apps/electron
        run: npm run typecheck
      - name: Lint
        working-directory: apps/electron
        run: npm run lint
      - name: Test
        working-directory: apps/electron
        run: npm run test:run
      - name: Build
        working-directory: apps/electron
        run: npm run build
