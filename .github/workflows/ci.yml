name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    # 60: a cache miss on the Zig archive cost 17 to 24 minutes on 24/25-nov-2026.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/electron/package-lock.json
            packages/*/package-lock.json
            apps/model-host/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject unreviewed secrets
        shell: bash
        run: |
          python -m pip install detect-secrets
          git grep -Il -e . -- . | grep -v '^.secrets.baseline$' | xargs -n 100 detect-secrets-hook --baseline .secrets.baseline
      - name: Install and build shared packages
        # better-sqlite3 13 ships its Node-API binary in the package
        # (prebuilds/win32-x64.node) and loads it under Node and Electron, so
        # --ignore-scripts leaves nothing to build or download.
        run: |
          for n in ai-providers calendar-sync connectors connectors-slack database jensen-protocol knowledge-graph transcription; do
            (cd "packages/$n" && npm ci --ignore-scripts && npm run build --if-present)
          done
      - name: Lint and test shared packages
        run: |
          for n in ai-providers calendar-sync connectors connectors-slack database jensen-protocol knowledge-graph transcription; do
            (cd "packages/$n" && npm run lint --if-present && npm test)
          done
      - name: Install app
        # Before the host tests: the VAD test runs the app's ffmpeg-static.
        working-directory: apps/electron
        run: npm ci
      - name: Install the Electron binary
        # Electron downloads its binary on the first require when the
        # postinstall did not. Two test workers did that at once and one
        # failed on a half-written dist folder (28-oct-2026, os error 183).
        working-directory: apps/electron
        run: node node_modules/electron/install.js && node -e "console.log(require('electron'))"
      - name: Cache the Zig archive
        # ziglang.org served the archive in 17 to 24 minutes on 24/25-nov-2026
        # even with the progress bar off, and the job hit its 45-minute limit.
        # The cached zip is still checked against the published SHA-256 below.
        uses: actions/cache@v6
        with:
          path: ~/zig-archive
          key: zig-0.16.0-x86_64-windows-68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e  # pragma: allowlist secret
      - name: Install Zig 0.16.0
        # mlugg/setup-zig still runs on Node.js 20 in every release (v2.2.1 and
        # main, checked 24-nov-2026), and GitHub is retiring Node 20 actions.
        # The official archive, checked against the SHA-256 that
        # ziglang.org/download/index.json publishes for it.
        shell: pwsh
        env:
          ZIG_SHA256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e  # pragma: allowlist secret
        run: |
          # Windows PowerShell's progress bar slows Invoke-WebRequest to a crawl:
          # the archive took 20 and 22 minutes on 24-nov-2026 and the job hit
          # its 45-minute limit.
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $sha = $env:ZIG_SHA256
          $cache = Join-Path $HOME 'zig-archive'
          New-Item -ItemType Directory -Force -Path $cache | Out-Host
          $zip = Join-Path $cache 'zig.zip'
          if (-not (Test-Path $zip)) { Invoke-WebRequest -Uri $url -OutFile $zip }
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $sha) { throw "zig archive checksum mismatch: $got" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0'
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'zig.exe') version
      - name: Model Host tests
        # The host ships to another machine on its own installer; nothing else
        # in this workflow runs its tests. build:tray compiles the tray icon
        # with -Werror and runs its decision tests; the tray end-to-end test
        # then runs against that build. provision_tls.py needs cryptography,
        # pinned as installer/setup.ps1 installs it on the host.
        working-directory: apps/model-host
        run: |
          python -m pip install 'cryptography>=42,<51'
          npm ci && npm run build:tray && npm test
      - name: Model Host Python worker tests
        # The workers run on the host as scripts, not as part of the vitest
        # suite, and nothing ran their tests here: align_worker's import bug
        # shipped in host 0.6.0 that way (fixed in 0.6.1). Standard library
        # only, so no pip install; the tests that need a GPU or a model skip
        # themselves. The standalone-launch test in test_align_worker.py runs
        # the worker with `python -P` from another folder, as the host does.
        # FFMPEG_PATH points the parakeet ffmpeg test at the bundled binary.
        working-directory: apps/model-host
        env:
          FFMPEG_PATH: ${{ github.workspace }}/apps/electron/node_modules/ffmpeg-static/ffmpeg.exe
        run: python -m unittest discover -s tests -v
      - name: Packaging preflight
        working-directory: apps/electron
        # The packaging scripts run this too, but CI never packages on a pull
        # request, so without this step a dependency tree that cannot be
        # packaged is only found at release time. It takes seconds.
        run: node scripts/preflight-package.mjs
      - name: Typecheck
        working-directory: apps/electron
        run: npm run typecheck
      - name: Lint
        working-directory: apps/electron
        run: npm run lint
      - name: Test
        working-directory: apps/electron
        run: npm run test:run
      - name: Build
        working-directory: apps/electron
        run: npm run build
