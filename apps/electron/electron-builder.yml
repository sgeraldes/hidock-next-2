appId: com.hidock.next
productName: HiDock Next
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!**/.venv*/**'
  - '!node_modules/.ignored/**'
  - '!dist/**'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/speaker-linking
    to: speaker-linking
# Refuse a package whose better-sqlite3 the packed Electron cannot load (25-sep: a Node-built binary shipped).
afterPack: scripts/after-pack-check-native.cjs
asarUnpack:
  - '**/*.node'
  - '**/usb/**'
  - '**/ffmpeg-static/**'
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: HiDock Next
  # Native packages ship binaries for every platform; the Windows x64 build needs only its own.
  # Each loader picks the win32-x64 file at runtime: onnxruntime-node bin/napi-v6/win32/x64,
  # better-sqlite3 prebuilds/win32-x64.node, usb prebuilds/win32-x64 (node-gyp-build).
  # Adding an arm64 target means removing the win32-arm64 lines.
  # Only exclusions (!) here: a positive pattern would replace the default include set and silently
  # drop runtime files from the Windows build.
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
    - '!node_modules/better-sqlite3/prebuilds/darwin-*.node'
    - '!node_modules/better-sqlite3/prebuilds/linux-*.node'
    - '!node_modules/better-sqlite3/prebuilds/linuxmusl-*.node'
    - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
    - '!node_modules/usb/prebuilds/android-*/**'
    - '!node_modules/usb/prebuilds/darwin-*/**'
    - '!node_modules/usb/prebuilds/linux-*/**'
    - '!node_modules/usb/prebuilds/win32-arm64/**'
    - '!node_modules/usb/prebuilds/win32-ia32/**'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: HiDock Next contributors
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: github
  owner: sgeraldes
  repo: hidock-next-2
