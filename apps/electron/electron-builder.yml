appId: com.hidock.next
productName: HiDock Next
directories:
  buildResources: resources
  output: dist
files:
  # Keep one application-root matcher. Platform files arrays create a second
  # inclusive matcher in builder 26.x and can bypass shared exclusions.
  # Production dependencies are collected separately by electron-builder.
  - 'out/main/**/*'
  - 'out/preload/**/*'
  - 'out/renderer/**/*'
  - 'package.json'
  - '!**/.vscode/*'
  - '!**/.venv*/**'
  - '!node_modules/.ignored/**'
  - '!dist/**'
  - '!logs/**'
  - '!**/logs{,/**/*}'
  - '!**/.security-key'
  - '!node_modules/.cache/**'
  - '!src/**'
  - '!electron/**'
  - '!scripts/**'
  - '!**/.diagnostics/**'
  - '!**/__tests__/**'
  - '!**/*.test.*'
  - '!**/*.spec.*'
  - '!package-lock.json'
  - '!out/vitest-cache/**'
  - '!**/.vitest/**'
  - '!**/*.tsbuildinfo'
  - '!**/*.log'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/firmware
    to: firmware
  - from: resources/speaker-linking
    to: speaker-linking
# Refuse a package whose better-sqlite3 the packed Electron cannot load (25-sep: a Node-built binary shipped).
afterPack: scripts/after-pack-check-firmware.cjs
asarUnpack:
  - '**/*.node'
  - '**/usb/**'
  - '**/node-gyp-build/**'
  - '**/ffmpeg-static/**'
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: HiDock Next
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: HiDock Next contributors
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: github
  owner: sgeraldes
  repo: hidock-next-2
